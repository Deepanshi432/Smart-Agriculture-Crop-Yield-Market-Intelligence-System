<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Smart Agriculture — Crop Yield & Market Intelligence</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f4f7f5;
      color: #1f2933;
    }
    header {
      background: #1b5e20;
      color: #fff;
      padding: 18px 28px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }
    header a {
      color: #e8f5e9;
      text-decoration: none;
      border: 1px solid #a5d6a7;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 14px;
    }
    .container {
      max-width: 1100px;
      margin: 24px auto;
      padding: 0 16px;
    }
    .kpis {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }
    .card {
      background: #fff;
      border-radius: 10px;
      padding: 18px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
      margin-bottom: 20px;
    }
    .kpi-label {
      font-size: 13px;
      color: #52606d;
      margin-bottom: 6px;
    }
    .kpi-value {
      font-size: 26px;
      font-weight: bold;
      color: #1b5e20;
    }
    .grid-2 {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
      gap: 20px;
    }
    label {
      display: block;
      font-size: 13px;
      font-weight: bold;
      margin-top: 10px;
      margin-bottom: 4px;
    }
    select, input, button {
      width: 100%;
      padding: 9px 10px;
      border-radius: 6px;
      border: 1px solid #cbd2d9;
      font-size: 14px;
      box-sizing: border-box;
    }
    button {
      background: #2e7d32;
      color: #fff;
      border: none;
      font-weight: bold;
      margin-top: 14px;
      cursor: pointer;
    }
    button:hover {
      background: #1b5e20;
    }
    .result-box {
      margin-top: 14px;
      padding: 12px;
      background: #e8f5e9;
      border-left: 4px solid #2e7d32;
      border-radius: 6px;
      font-size: 14px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }
    th, td {
      text-align: left;
      padding: 8px 10px;
      border-bottom: 1px solid #e4e7eb;
    }
    th {
      background: #f0f4f8;
    }
  </style>
</head>
<body>
  <header>
    <div>
      <h2 style="margin:0;">🌾 Smart Agriculture: Crop Yield & Market Intelligence</h2>
      <small>Web API + Frontend Layer</small>
    </div>
    <a href="http://localhost:8501" target="_blank">Open Streamlit Analytics (8501)</a>
  </header>

  <div class="container">
    <div class="kpis">
      <div class="card">
        <div class="kpi-label">Total Records</div>
        <div class="kpi-value" id="kpi-records">-</div>
      </div>
      <div class="card">
        <div class="kpi-label">States Covered</div>
        <div class="kpi-value" id="kpi-states">-</div>
      </div>
      <div class="card">
        <div class="kpi-label">Crops Covered</div>
        <div class="kpi-value" id="kpi-crops">-</div>
      </div>
    </div>

    <div class="grid-2">
      <div class="card">
        <h3>Crop Yield Estimator</h3>
        <form id="predict-form">
          <label for="state">State</label>
          <select id="state" name="state"></select>

          <label for="district">District</label>
          <select id="district" name="district"></select>

          <label for="crop">Crop</label>
          <select id="crop" name="crop"></select>

          <label for="season">Season</label>
          <select id="season" name="season"></select>

          <label for="year">Crop Year</label>
          <input type="number" id="year" name="year" value="2020" />

          <label for="area">Area (Hectares)</label>
          <input type="number" step="0.01" id="area" name="area" value="100" />

          <button type="submit">Predict Yield</button>
        </form>
        <div id="predict-result" class="result-box" style="display:none;"></div>
      </div>

      <div class="card">
        <h3>Top Crops by Production</h3>
        <table>
          <thead>
            <tr><th>Crop</th><th>Total Production</th></tr>
          </thead>
          <tbody id="top-crops-body">
            <tr><td colspan="2">Loading...</td></tr>
          </tbody>
        </table>
      </div>
    </div>

    <div class="card">
      <h3>Mandi Price Explorer</h3>
      <div style="display:flex; gap:10px; max-width:450px;">
        <input type="text" id="mandi-filter" placeholder="Filter by commodity (e.g., Rice, Wheat)" />
        <button type="button" onclick="loadMandi()" style="width:auto; margin-top:0;">Search</button>
      </div>
      <div id="mandi-output" style="margin-top:12px; font-size:13px; color:#52606d;">Loading mandi data...</div>
    </div>
  </div>

  <script>
    async function loadSummary() {
      const res = await fetch("/api/summary");
      const data = await res.json();
      document.getElementById("kpi-records").textContent = (data.total_records || 0).toLocaleString();
      document.getElementById("kpi-states").textContent = data.states_count ?? 0;
      document.getElementById("kpi-crops").textContent = data.crops_count ?? 0;

      const tbody = document.getElementById("top-crops-body");
      if (!data.top_crops || !data.top_crops.length) {
        tbody.innerHTML = '<tr><td colspan="2">No production summary available</td></tr>';
        return;
      }
      tbody.innerHTML = data.top_crops
        .map(item => `<tr><td>${item.crop}</td><td>${Number(item.production).toLocaleString()}</td></tr>`)
        .join("");
    }

    function fillSelect(id, items) {
      const el = document.getElementById(id);
      el.innerHTML = items.map(v => `<option value="${v}">${v}</option>`).join("");
    }

    async function loadDistricts(stateVal) {
      const res = await fetch(`/api/options?state=${encodeURIComponent(stateVal || "")}`);
      const data = await res.json();
      fillSelect("district", data.districts || []);
    }

    async function loadOptions() {
      const res = await fetch("/api/options");
      const data = await res.json();
      fillSelect("state", data.states || []);
      fillSelect("crop", data.crops || []);
      fillSelect("season", data.seasons || []);
      if (data.states && data.states.length) {
        await loadDistricts(data.states[0]);
      }
    }

    document.getElementById("state").addEventListener("change", (e) => loadDistricts(e.target.value));

    document.getElementById("predict-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const body = {
        state: document.getElementById("state").value,
        district: document.getElementById("district").value,
        crop: document.getElementById("crop").value,
        season: document.getElementById("season").value,
        year: Number(document.getElementById("year").value),
        area: Number(document.getElementById("area").value),
      };
      const res = await fetch("/api/predict", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body),
      });
      const out = await res.json();
      const box = document.getElementById("predict-result");
      box.style.display = "block";
      box.innerHTML = `
        <strong>Crop:</strong> ${out.crop || "-"} (${out.state || "-"})<br/>
        <strong>Estimated Yield:</strong> ${out.predicted_yield}<br/>
        <strong>Estimated Production:</strong> ${Number(out.estimated_production).toLocaleString()}
      `;
    });

    async function loadMandi() {
      const q = document.getElementById("mandi-filter").value.trim();
      const res = await fetch(`/api/mandi?commodity=${encodeURIComponent(q)}`);
      const data = await res.json();
      const out = document.getElementById("mandi-output");
      if (!data.rows || !data.rows.length) {
        out.textContent = "No mandi records found for this filter.";
        return;
      }
      const cols = Object.keys(data.rows[0]).slice(0, 6);
      const head = cols.map(c => `<th>${c}</th>`).join("");
      const rowsHtml = data.rows
        .map(r => `<tr>${cols.map(c => `<td>${r[c]}</td>`).join("")}</tr>`)
        .join("");
      out.innerHTML = `<table><thead><tr>${head}</tr></thead><tbody>${rowsHtml}</tbody></table>`;
    }

    loadSummary();
    loadOptions();
    loadMandi();
  </script>
</body>
</html>
